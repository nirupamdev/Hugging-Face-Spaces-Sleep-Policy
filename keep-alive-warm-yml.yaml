name: Keep HF Space Warm

# Pings every 6 hours to keep the Space consistently warm.
# Includes retry logic for when Space is waking from sleep.
#
# Setup:
# 1. Add HF_TOKEN and SPACE_URL secrets
# 2. Uncomment the schedule below to enable

on:
  schedule:
    # Every 6 hours — keeps Space warm with minimal cold start
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: hf-space-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPACE_URL: ${{ secrets.SPACE_URL }}
    steps:
      - name: Wake the Space (with retry)
        run: |
          set -euo pipefail
          url="${SPACE_URL}/health"
          echo "Pinging $url"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              --max-time 90 "$url" || echo "000")
            echo "attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              echo "✅ Space is awake."
              cat /tmp/resp.txt
              exit 0
            fi
            sleep 20
          done
          echo "::error::Space did not respond after 6 attempts."
          exit 1
